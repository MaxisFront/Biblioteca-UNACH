<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Catálogo</title>
</head>

<body>
    <main class="main">
        <div class="app__layout">
            <nav>

            </nav>

            <section class="main__books">
                <header class="header">
                    <h2 class="header__title">Catalógo de libros</h2>
                    <span class="header__description">100 libros registrados</span>
                    <div class="header__button">
                        <button class="button__add"> <span class="button__icon">+</span> Nuevo Libro</button>
                    </div>
                </header>

                <div class="search-bar">
                    <input type="text" placeholder="Buscar por título, autor o género...">
                </div>

                <div class="books__table">
                    <div class="table__container">
                        <div class="table">

                            <div class="table__header-row">
                                <div class="table__header-cell table__header-cell--title">Libro</div>
                                <div class="table__header-cell table__header-cell--username">Usuario</div>
                                <div class="table__header-cell table__header-cell--expiration">Vencimiento</div>
                                <div class="table__header-cell table__header-cell--status">Estado</div>
                            </div>

                            <div class="table__row">
                                <div class="table__cell table__cell--title">1984</div>
                                <div class="table__cell table__cell--username">Roberto Ramírez</div>
                                <div class="table__cell table__cell--expiration">26 sep 2026</div>
                                <div class="table__cell table__cell--status">
                                    <span class="status status--active">Activo</span>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
