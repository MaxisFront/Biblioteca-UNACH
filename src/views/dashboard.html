<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/dashboard.css" />
    <script type="module" src="../components/sideabar.js"></script>
    <script type="module" src="../services/dashboard.js"></script>

    <title>Dashboard</title>
  </head>

  <body>
    <main class="main">
      <div class="app__layout">
        <nav class="main__menu">
          <mi-sidebar active-item="dashboard"></mi-sidebar>
        </nav>

        <section class="main__dashboard">
          <header class="dashboard__header">
            <div class="dashboard__text">
              <h2 class="dashboard__title">Panel general</h2>
              <span class="dashboard__description"
                >Vista general de la biblioteca</span
              >
            </div>
          </header>

          <div class="dashboard__statistics">
            <div class="dashboard__card">
              <h3 class="card__title">Total de libros</h3>
              <span class="card__number card__number--books">–</span>
            </div>

            <div class="dashboard__card">
              <h3 class="card__title">Préstamos activos</h3>
              <span class="card__number card__number--loans">–</span>
            </div>
            <div class="dashboard__card">
              <h3 class="card__title">Usuarios</h3>
              <span class="card__number card__number--users">–</span>
            </div>
          </div>

          <div class="dashboard__table">
            <div class="table__container">
              <h3 class="table__title">Préstamos Recientes</h3>
              <div class="table">
                <div class="table__header-row">
                  <div class="table__header-cell table__header-cell--title">
                    Libro
                  </div>
                  <div class="table__header-cell table__header-cell--username">
                    Usuario
                  </div>
                  <div
                    class="table__header-cell table__header-cell--expiration"
                  >
                    Vencimiento
                  </div>
                  <div class="table__header-cell table__header-cell--status">
                    Estado
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
