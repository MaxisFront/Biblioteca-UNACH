<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <title>Dashboard</title>
</head>

<body>
    <main class="main">
        <div class="app__layout">

            <nav class="main__menu">

            </nav>

            <section class="main__dashboard">
                <div class="dashboard__header">
                    <h2 class="dashboard__title">Panel general</h2>
                    <span class="dashboard__description">Vista general de la biblioteca</span>
                </div>

                <div class="dashboard__statics">
                    <div class="dashboard__card">
                        <h3 class="card__title">Total de libros</h3>
                        <span class="card__number">6</span>
                        <h4 class="card__indicator">23 ejemplares</h4>
                    </div>

                    <div class="dashboard__card">
                        <h3 class="card__title">Prestamos activos</h3>
                        <span class="card__number">3</span>
                        <h4 class="card__indicator">2 vencidos</h4>
                    </div>
                    <div class="dashboard__card">
                        <h3 class="card__title">Usuarios</h3>
                        <span class="card__number">5</span>
                        <h4 class="card__indicator">4 activos</h4>
                    </div>
                </div>

                <div class="dashboard__table">
                    <div class="table__container">
                        <h3 class="table__title">Prestamos:</h3>
                        <div class="table">

                            <div class="table__header--row">
                                <div class="table__header-cell table__header-cell--title">Libro</div>
                                <div class="table__header-cell--user">Usuario</div>
                                <div class="table__header-cell--expiration">Vencimiento</div>
                                <div class="table__header-cell--status">Estado</div>
                            </div>


                            <div class="table__row">
                                <div class="table__row-cell table__row-cell--title">El principito</div>
                                <div class="table__row-cell table__row-cell--user">Carlos Andres</div>
                                <div class="table__row-cell table__row-cell--expiration">Hoy</div>
                                <div class="table__row-cell table__row-cell--status">Activo</div>
                            </div>
                        </div>
            </section>
        </div>
    </main>
</body>

</html>
