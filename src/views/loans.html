<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link rel="stylesheet" href="../styles/loans.css" />
    <link rel="stylesheet" href="../styles/modal.css" />
    <link rel="stylesheet" href="../styles/header-actions.css" />
    <script type="module" src="../components/sideabar.js"></script>
    <script type="module" src="../js/core.js"></script>
    <script type="module" src="../services/prestamos.js"></script>

    <title>Préstamos</title>
  </head>

  <body>
    <main class="main">
      <div class="app__layout">
        <nav>
          <mi-sidebar active-item="loans"></mi-sidebar>
        </nav>

        <section class="main__loans">
          <header class="header">
            <div class="header__text">
              <h2 class="header__title">Gestión de préstamos</h2>
              <span class="header__description"
                >Préstamos de la biblioteca</span
              >
            </div>

            <div class="header__button">
              <button
                type="button"
                class="button__add"
                data-open="loan-add-dialog"
              >
                <span class="button__icon">+</span> Nuevo Préstamo
              </button>
              <button
                type="button"
                class="button__edit"
                data-open="loan-edit-dialog"
              >
                <span
                  class="button__icon button__icon--edit"
                  aria-hidden="true"
                ></span>
                Editar Préstamo
              </button>
            </div>
          </header>

          <dialog id="loan-add-dialog">
            <div class="modal">
              <div class="modal__header">
                <h3 class="modal__title">Nuevo préstamo</h3>
                <button
                  type="button"
                  class="modal__button modal__button--close"
                  aria-label="Cerrar"
                >
                  &times;
                </button>
              </div>

              <div class="modal__form">
                <form id="loan-form">
                  <div class="modal__field">
                    <label for="loan-book" class="modal__label">Libro</label>
                    <select id="loan-book" required>
                      <option value="" disabled selected>
                        Seleccionar libro...
                      </option>
                    </select>
                  </div>

                  <div class="modal__field">
                    <label for="loan-user" class="modal__label">Usuario</label>
                    <select id="loan-user" required>
                      <option value="" disabled selected>
                        Seleccionar usuario...
                      </option>
                    </select>
                  </div>

                  <div class="modal__field">
                    <label for="loan-date" class="modal__label"
                      >Fecha de devolución estimada</label
                    >
                    <input type="date" id="loan-date" required />
                  </div>

                  <div class="modal__actions">
                    <button
                      type="button"
                      class="modal__button modal__button--cancel"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      class="modal__button modal__button--submit"
                    >
                      Enviar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </dialog>

          <dialog id="loan-edit-dialog">
            <div class="modal">
              <div class="modal__header">
                <h2 class="modal__title">Editar préstamo</h2>
                <button
                  type="button"
                  class="modal__button modal__button--close"
                  aria-label="Cerrar"
                >
                  &times;
                </button>
              </div>

              <div class="modal__form">
                <form id="loan-edit-form">
                  <div class="modal__field">
                    <label for="loan-edit-select" class="modal__label"
                      >Préstamo a editar</label
                    >
                    <select id="loan-edit-select" required>
                      <option value="" disabled selected>
                        Seleccionar préstamo...
                      </option>
                      <option value="1">Apocalypse Now — Selene Gómez</option>
                      <option value="2">1984 — Jonh Conrad</option>
                      <option value="3">
                        El señor de las Moscas — James Martínez
                      </option>
                    </select>
                  </div>

                  <div class="modal__field">
                    <label for="loan-edit-due-date" class="modal__label"
                      >Fecha límite</label
                    >
                    <input type="date" id="loan-edit-due-date" required />
                  </div>

                  <div class="modal__field">
                    <label for="loan-edit-return-date" class="modal__label"
                      >Fecha de entrega (opcional)</label
                    >
                    <input type="date" id="loan-edit-return-date" />
                  </div>

                  <div class="modal__actions">
                    <button
                      type="button"
                      class="modal__button modal__button--cancel"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      class="modal__button modal__button--submit"
                      disabled
                    >
                      Guardar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </dialog>

          <div class="loans__table">
            <div class="table__container">
              <div class="table">
                <div class="table__header-row">
                  <div class="table__header-cell table__header-cell--title">
                    Libro
                  </div>
                  <div class="table__header-cell table__header-cell--username">
                    Usuario
                  </div>
                  <div class="table__header-cell table__header-cell--loan-date">
                    Fecha Préstamo
                  </div>
                  <div class="table__header-cell table__header-cell--due-date">
                    Fecha Límite
                  </div>
                  <div
                    class="table__header-cell table__header-cell--return-date"
                  >
                    Fecha Entregado
                  </div>
                  <div class="table__header-cell table__header-cell--status">
                    Estado
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
