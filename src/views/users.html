<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/users.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <script type="module" src="../components/sideabar.js"></script>
    <script type="module" src="../js/core.js"></script>

    <title>Users</title>
</head>

<body>
    <main>
        <div class="app__layout">
            <nav class="main__menu">
                <mi-sidebar active-item="users"></mi-sidebar>
            </nav>

            <section class="main__users">
                <header class="header">
                    <div class="header__text">
                        <h2 class="users__title">Usuarios</h2>
                        <span class="users__description">6 Usuarios registrados</span>
                    </div>

                    <div class="header__button">
                        <button class="button__add"><span class="button__icon">+</span> Nuevo Usuario</button>
                    </div>
                </header>

                <dialog id="users-dialog">
                    <div class="modal">
                        <div class="modal__header">
                            <h2 class="modal__title">Nuevo Usuario</h2>
                            <button type="button" class="modal__button modal__button--close"
                                aria-label="Cerrar">&times;</button>
                        </div>

                        <div class="modal__form">
                            <form id="user-form">
                                <div class="modal__field">
                                    <label for="user-name" class="modal__label">Nombre Completo</label>
                                    <input type="text" id="user-name" placeholder="Juan Ortega" minlength="5" required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-mail" class="modal__label">Correo Electrónico</label>
                                    <input type="email" id="user-mail" placeholder="Juan@biblioteca.com" minlength="5"
                                        required>
                                </div>
                                <div class="modal__field">
                                    <label for="user-tel" class="modal__label">Teléfono</label>
                                    <input type="number" id="user-tel" placeholder="961123456" minlength="10" required>
                                </div>
                                <div class="modal__field">
                                    <label for="user-date" class="modal__label">Correo Electrónico</label>
                                    <input type="date" id="user-date" placeholder="dd/mm/aa" required>
                                </div>
                            </form>
                        </div>
                        <div class="modal__actions">
                            <button type="button" class="modal__button modal__button--cancel">Cancelar</button>
                            <button type="submit" class="modal__button modal__button--submit" disabled>Enviar</button>
                        </div>
                    </div>
                </dialog>

                <div class="search-bar">
                    <input type="text" placeholder="Buscar por nombre o Teléfono">
                </div>

                <div class="users__table">
                    <div class="table">
                        <div class="user-profile">
                            <div class="user__info">
                                <h2 class="user__name">Jorge Orantes</h2>
                                <div class="user__contact">
                                    <p class="user__mail">Jorge@biblioteca.com</p>
                                    <p class="user__tel">9613836700</p>
                                </div>
                            </div>
                            <div class="register__date">
                                26/08/2026
                            </div>

                            <div class="user__actions">
                                <button class="icon icon--return" title="Devolver libro" aria-label="Devolver"><img
                                        src="../assets/icons/Return.svg" alt=""></button>

                                <button class="icon icon--delete" title="Elimina préstamo" aria-label="Eliminar"><img
                                        src="../assets/icons/Trash.svg" alt=""></button>

                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>

</html>
