<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/users.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link rel="stylesheet" href="../styles/header-actions.css">
    <script type="module" src="../components/sideabar.js"></script>
    <script type="module" src="../services/user.js"></script>
    <script type="module" src="../js/core.js"></script>

    <title>Users</title>
</head>

<body>
    <main>
        <div class="app__layout">
            <nav class="main__menu">
                <mi-sidebar active-item="users"></mi-sidebar>
            </nav>

            <section class="main__users">
                <header class="header">
                    <div class="header__text">
                        <h2 class="users__title">Usuarios</h2>
                        <span class="users__description">6 Usuarios registrados</span>
                    </div>

                    <div class="header__button">
                        <button type="button" class="button__add" data-open="user-add-dialog"><span
                                class="button__icon">+</span> Nuevo Usuario</button>
                        <button type="button" class="button__edit" data-open="user-edit-dialog"><span
                                class="button__icon button__icon--edit" aria-hidden="true"></span> Editar
                            Usuario</button>
                    </div>
                </header>

                <dialog id="user-add-dialog">
                    <div class="modal">
                        <div class="modal__header">
                            <h2 class="modal__title">Nuevo Usuario</h2>
                            <button type="button" class="modal__button modal__button--close"
                                aria-label="Cerrar">&times;</button>
                        </div>

                        <div class="modal__form">
                            <!-- Formulario de Creación -->
                            <form id="user-form">
                                <div class="modal__field">
                                    <label for="user-name" class="modal__label">Nombre</label>
                                    <input type="text" id="user-name" placeholder="Juan" minlength="2" required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-lastname" class="modal__label">Apellido</label>
                                    <input type="text" id="user-lastname" placeholder="Ortega" minlength="2" required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-sex" class="modal__label">Sexo</label>
                                    <select id="user-sex" required>
                                        <option value="" disabled selected>Seleccionar sexo...</option>
                                        <option value="Masculino">Masculino</option>
                                        <option value="Femenino">Femenino</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>

                                <div class="modal__field">
                                    <label for="user-mail" class="modal__label">Correo Electrónico</label>
                                    <input type="email" id="user-mail" placeholder="Juan@biblioteca.com" required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-tel" class="modal__label">Teléfono</label>
                                    <input type="tel" id="user-tel" inputmode="numeric" placeholder="9611234567"
                                        pattern="[0-9]{10}" maxlength="10" required>
                                </div>

                                <div class="modal__actions">
                                    <button type="button" class="modal__button modal__button--cancel">Cancelar</button>
                                    <button type="submit" class="modal__button modal__button--submit">Enviar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </dialog>

                <dialog id="user-edit-dialog">
                    <div class="modal">
                        <div class="modal__header">
                            <h2 class="modal__title">Editar usuario</h2>
                            <button type="button" class="modal__button modal__button--close"
                                aria-label="Cerrar">&times;</button>
                        </div>

                        <div class="modal__form">
                            <form id="user-edit-form">
                                <div class="modal__field">
                                    <label for="user-edit-select" class="modal__label">Usuario a editar</label>
                                    <select id="user-edit-select" required>
                                        <option value="" disabled selected>Seleccionar usuario...</option>
                                        <option value="1">María Fernández</option>
                                        <option value="2">Roberto James</option>
                                        <option value="3">Jorge Orantes</option>
                                    </select>
                                </div>

                                <div class="modal__field">
                                    <label for="user-edit-name" class="modal__label">Nombre Completo</label>
                                    <input type="text" id="user-edit-name" placeholder="Juan Ortega" minlength="5"
                                        required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-edit-mail" class="modal__label">Correo Electrónico</label>
                                    <input type="email" id="user-edit-mail" placeholder="Juan@biblioteca.com"
                                        minlength="5" required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-edit-tel" class="modal__label">Teléfono</label>
                                    <input type="tel" id="user-edit-tel" inputmode="numeric" placeholder="9611234567"
                                        pattern="[0-9]{10}" maxlength="10" required>
                                </div>

                                <div class="modal__field">
                                    <label for="user-edit-status" class="modal__label">Estado</label>
                                    <select id="user-edit-status" required>
                                        <option value="activo">Activo</option>
                                        <option value="desactivado">Desactivado</option>
                                    </select>
                                </div>

                                <div class="modal__actions">
                                    <button type="button" class="modal__button modal__button--cancel">Cancelar</button>
                                    <button type="submit" class="modal__button modal__button--submit"
                                        disabled>Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </dialog>

                <div class="search-bar">
                    <input type="text" placeholder="Buscar por nombre o Teléfono">
                </div>

                <div class="users__list">

                </div>
            </section>
        </div>
    </main>
</body>

</html>
